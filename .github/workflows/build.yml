name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  independent-build:
    name: Revit-independent build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore test dependencies
        run: dotnet restore tests/UnitTests/UnitTests.csproj
      - name: Build Revit-independent projects
        run: dotnet build tests/UnitTests/UnitTests.csproj --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/UnitTests/UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx"
      - name: Explain Revit integration boundary
        shell: pwsh
        run: |
          'Revit Entry was intentionally not built: Autodesk RevitAPI.dll and RevitAPIUI.dll are licensed dependencies and are not downloaded by CI.' | Out-File -Encoding utf8 build-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-report
          path: |
            build-report.txt
            **/TestResults/*.trx
